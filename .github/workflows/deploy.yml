name: CI/CD Pipeline - Dipak Vishwakarma Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run Next.js Build
        run: npm run build

      - name: Assemble Standalone Deployment Package
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp Dockerfile .next/standalone/Dockerfile
          cp docker-compose.prod.yml .next/standalone/docker-compose.prod.yml

      - name: Setup SSH Key and Config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          cat <<EOF > ~/.ssh/config
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync Standalone Build to Remote Host
        run: |
          ssh production "mkdir -p /home/nivi/apps/dipak-web"
          rsync -avz --delete \
            .next/standalone/ production:/home/nivi/apps/dipak-web/

      - name: Recreate Production Container (Instant)
        run: |
          ssh production << 'EOF'
            set -e
            cd /home/nivi/apps/dipak-web
            echo "1. Instant Docker image build from standalone bundle..."
            docker compose -f docker-compose.prod.yml build dipak-web
            
            echo "2. Recreating container instantaneously..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --build dipak-web
            
            echo "3. Cleaning up dangling images..."
            docker image prune -f || true
          EOF

      - name: Verify Live Production Health
        run: |
          echo "Waiting 3s for container readiness and Traefik verification..."
          sleep 3
          for i in {1..15}; do
            echo "Attempt $i: Checking https://dipakvishwakarma.com/api/health..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dipakvishwakarma.com/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production Health Check PASSED (HTTP 200)!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Health check did not return HTTP 200 in expected time window."
          exit 1
