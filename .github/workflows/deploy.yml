name: CI/CD Pipeline - Dipak Vishwakarma Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run Next.js Build
        run: npm run build

      - name: Assemble Standalone Bundle
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Build Production Docker Image
        run: |
          cat << 'EOF' > .next/standalone/Dockerfile
          FROM node:22-alpine
          WORKDIR /app
          ENV NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 HOSTNAME=0.0.0.0 PORT=3000
          RUN addgroup --system --gid 1001 nodejs && adduser --system --uid 1001 nextjs
          COPY --chown=nextjs:nodejs . ./
          USER nextjs
          EXPOSE 3000
          CMD ["node", "server.js"]
          EOF
          
          docker build -t dipak-web-image:latest .next/standalone

      - name: Setup SSH Key and Config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          cat <<EOF > ~/.ssh/config
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync Configuration & Stream Docker Image to Production
        run: |
          ssh production "mkdir -p /home/nivi/apps/dipak-web"
          scp docker-compose.prod.yml production:/home/nivi/apps/dipak-web/docker-compose.prod.yml
          echo "Streaming compressed Docker image to nivi..."
          docker save dipak-web-image:latest | gzip -1 | ssh production "
            set -e
            echo '1. Loading Docker image into daemon...'
            docker load
            cd /home/nivi/apps/dipak-web
            echo '2. Stopping old container...'
            docker stop dipak-web || true
            docker rm dipak-web || true
            echo '3. Starting new container...'
            docker compose -f docker-compose.prod.yml up -d dipak-web
            echo '4. Cleaning dangling images...'
            docker image prune -f || true
          "

      - name: Verify Live Production Health
        run: |
          echo "Waiting 3s for container readiness..."
          sleep 3
          for i in {1..15}; do
            echo "Attempt $i: Checking https://dipakvishwakarma.com/api/health..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dipakvishwakarma.com/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production Health Check PASSED (HTTP 200)!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Health check did not return HTTP 200 in expected time window."
          exit 1

