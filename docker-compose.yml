services:
  dipak-web:
    container_name: dipak-web
    build: .
    image: dipak-web:next
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.dipak-web.rule=Host(`dipakvishwakarma.com`) || Host(`www.dipakvishwakarma.com`)"
      - "traefik.http.routers.dipak-web.entrypoints=websecure"
      - "traefik.http.routers.dipak-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.dipak-web.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy_net:
    external: true

